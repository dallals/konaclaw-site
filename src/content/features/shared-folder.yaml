id: shared-folder
name: Shared folder
outcome: your-mac
status: shipped
headline: A folder you both can see
summary: >
  Drop files in a shared folder and Kona can read them, write reports back,
  and remember what was there.
detail: >
  The shared folder is the hand-off point. Kona reads documents you place
  there, writes results back as files you can open, and keeps a recall
  index so "that spreadsheet from March" is findable later.

id: cloud-optional
name: Cloud models, only if you ask
outcome: private
status: shipped
headline: Bring a cloud model when you want one
summary: >
  Add an API key for a hosted model and route a chat to it. Everything else
  keeps running locally.
detail: >
  Some questions deserve the biggest model available. Add a provider key in
  Settings and pick that model for one chat, one agent, or one task. Local
  stays the default, and the model in use is always shown on the message.
screenshot: models.png
requires: []

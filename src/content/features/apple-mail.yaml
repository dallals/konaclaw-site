id: apple-mail
name: Mail
outcome: your-mac
status: shipped
headline: Reads, searches, and sends your mail
summary: >
  Kona works in Apple Mail or Gmail: search across accounts, summarize a
  thread, draft a reply, and send it.
detail: >
  Ask what came in from your accountant this week, have the thread
  summarized, and send the reply from your own address. Fast search runs
  against the mail index rather than opening every message. Sending is
  always a separate, confirmed step.

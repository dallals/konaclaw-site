id: attachments
name: Attachments
outcome: your-mac
status: shipped
headline: Drag a file into the chat
summary: >
  PDF, Word, Excel, PowerPoint, and images all read locally, including text
  inside images and slides.
detail: >
  Drop a file onto the conversation and ask about it. Documents are parsed
  on the machine; images and scanned pages are read with on-device text
  recognition and a local vision model. Nothing is uploaded anywhere.
requires: []

name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    env: { PUBLIC_BUTTONDOWN_USERNAME: "${{ vars.PUBLIC_BUTTONDOWN_USERNAME || 'konaclaw' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: npx astro check
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # `astro preview` backgrounds itself only with `--background`; the curl poll below is a
      # readiness guard, not the mechanism that frees the step.
      - run: |
          npx astro preview --background --host 127.0.0.1 --port 4321
          for i in $(seq 1 15); do curl -sf http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
          npx playwright test
      - if: always()
        run: npx astro preview stop
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with: { args: "--offline --root-dir ./dist ./dist", fail: true }
      - run: npx lhci autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
